<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Lyon Sports | Admin
    </title>

    <link
        rel="icon"
        type="image/png"
        href="logo-lion-sem-fundo-2.png">

    <link
        rel="stylesheet"
        href="login.css">

</head>


<body>


    <main class="login">


        <div class="login-box">


            <img
                src="logo-lion-2.jpeg"
                alt="Lyon Sports">


            <p>
                PAINEL ADMINISTRATIVO
            </p>


            <h1>
                Entrar
            </h1>


            <form id="formLogin">


                <label>
                    Usuário
                </label>


                <input
                    id="usuario"
                    type="text"
                    required>


                <label>
                    Senha
                </label>


                <input
                    id="senha"
                    type="password"
                    required>


                <button>
                    ENTRAR
                </button>


            </form>


            <p
                class="erro"
                id="erro">

            </p>


        </div>


    </main>


    <script src="login.js"></script>


</body>

</html>
